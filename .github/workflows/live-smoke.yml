name: Public production API smoke checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public API responses
        shell: bash
        run: |
          set -euo pipefail
          api="https://kartik-jewellers-api.onrender.com/api"
          for route in health products store; do
            code=$(curl --retry 3 --retry-delay 4 --retry-all-errors --max-time 80 -sSL -o /tmp/kartik-response.json -w '%{http_code}' "$api/$route")
            echo "GET /api/$route -> HTTP $code"
            test "$code" = "200"
            node -e 'JSON.parse(require("fs").readFileSync("/tmp/kartik-response.json","utf8"))'
          done
          curl --retry 3 --retry-delay 4 --retry-all-errors --max-time 80 -fsSL "$api/products" -o /tmp/kartik-products.json
          node -e 'const p=require("/tmp/kartik-products.json");if(!Array.isArray(p))process.exit(1);console.log("Public products returned:",p.length)'
          code=$(curl --retry 2 --retry-delay 3 --max-time 80 -sSL -o /dev/null -w '%{http_code}' "$api/admin/products")
          echo "Unauthenticated admin route -> HTTP $code"
          test "$code" = "401"
